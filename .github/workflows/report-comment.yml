# Posts the JaCoCo coverage report as a PR comment, using the coverage XML built by
# "Report tests results" (report.yml). Split into its own workflow triggered by workflow_run
# so it always runs in the base repo's context with access to secrets/write permissions, even
# when report.yml itself was triggered by a pull_request from a fork (which never gets secrets).
name: Report coverage comment

on:
  workflow_run:
    workflows: ['Report tests results']
    types: [completed]

jobs:
  comment:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    permissions:
      pull-requests: write
      actions: read
    steps:
      - name: Download coverage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jacoco-reports
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read PR info
        id: pr
        run: |
          echo "number=$(cat pr-info/pr-number.txt)" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(cat pr-info/head-sha.txt)" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(cat pr-info/base-sha.txt)" >> "$GITHUB_OUTPUT"

      - name: Jacoco Report to PR
        id: jacoco
        uses: madrapps/jacoco-report@e51ce1f46f7f8b5331593f935e59cbaf44b84920 # v1.8.0
        with:
          paths: |
            ${{ github.workspace }}/library/build/jacoco/jacoco.xml,
            ${{ github.workspace }}/clustering/build/jacoco/jacoco.xml,
            ${{ github.workspace }}/data/build/jacoco/jacoco.xml,
            ${{ github.workspace }}/heatmaps/build/jacoco/jacoco.xml,
            ${{ github.workspace }}/ui/build/jacoco/jacoco.xml
          token: ${{ secrets.SYNCED_GITHUB_TOKEN_REPO }}
          pr-number: ${{ steps.pr.outputs.number }}
          head-sha: ${{ steps.pr.outputs.head_sha }}
          base-sha: ${{ steps.pr.outputs.base_sha }}
          min-coverage-overall: 26
          min-coverage-changed-files: 60
          title: Code Coverage
          debug-mode: false
          update-comment: true

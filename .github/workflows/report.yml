# A workflow that runs tests on every new pull request
name: Report tests results

on:
  repository_dispatch:
    types: [test]
  pull_request:
    branches-ignore: ['gh-pages']
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Create dummy secrets.properties
        run: echo "MAPS_API_KEY=dummy" > secrets.properties

      - name: Build modules
        run: ./gradlew build jacocoTestDebugUnitTestReport --stacktrace

      # Coverage reports are handed off to report-comment.yml (triggered via workflow_run) so the
      # PR comment step runs with the base repo's permissions/secrets, which aren't available here
      # when this workflow is triggered by a pull_request from a fork.
      - name: Save PR info
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p pr-info
          echo "${{ github.event.pull_request.number }}" > pr-info/pr-number.txt
          echo "${{ github.event.pull_request.head.sha }}" > pr-info/head-sha.txt
          echo "${{ github.event.pull_request.base.sha }}" > pr-info/base-sha.txt

      - name: Upload coverage artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacoco-reports
          retention-days: 1
          path: |
            pr-info/
            library/build/jacoco/jacoco.xml
            clustering/build/jacoco/jacoco.xml
            data/build/jacoco/jacoco.xml
            heatmaps/build/jacoco/jacoco.xml
            ui/build/jacoco/jacoco.xml

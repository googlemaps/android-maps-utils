name: Lint and Upload SARIF

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Create dummy secrets.properties
        run: echo "MAPS_API_KEY=dummy" > secrets.properties

      # The library module is now Kotlin Multiplatform; the KMP Android library plugin
      # does not create lintDebug/SARIF reporting tasks yet (tracked as a known gap of
      # the KMP migration). Lint the remaining plain Android modules instead.
      - name: Run Android Lint
        run: ./gradlew :data:lintDebug :ui:lintDebug :demo:lintStandardDebug

      - name: Upload SARIF for data
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: data/build/reports/lint-results.sarif
          category: data

      - name: Upload SARIF for ui
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: ui/build/reports/lint-results.sarif
          category: ui

      - name: Upload SARIF for demo
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: demo/build/reports/lint-results.sarif
          category: demo

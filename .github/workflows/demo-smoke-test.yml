# Opens every demo in the demo app on an emulator and checks that it starts, its map
# loads, and it survives a zoom out and back in. See demo/src/androidTest/.../smoke.
name: Demo smoke test

on:
  repository_dispatch:
    types: [test]
  pull_request:
    branches-ignore: ['gh-pages']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Checkout Repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Secrets are not available to pull requests from forks or Dependabot. Without a real
    # key every demo closes itself, so skip the emulator run instead of reporting noise.
    - name: Check for Maps API key
      id: key
      env:
        MAPS_API_KEY: ${{ secrets.ACTIONS_API_KEY }}
      run: |
        if [ -z "$MAPS_API_KEY" ]; then
          echo "::notice::ACTIONS_API_KEY is not available, skipping the demo smoke test."
          echo "available=false" >> "$GITHUB_OUTPUT"
        else
          echo "MAPS_API_KEY=$MAPS_API_KEY" > secrets.properties
          echo "available=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up JDK 21
      if: steps.key.outputs.available == 'true'
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      if: steps.key.outputs.available == 'true'
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

    - name: Enable KVM
      if: steps.key.outputs.available == 'true'
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Build demo and test APKs
      if: steps.key.outputs.available == 'true'
      run: ./gradlew :demo:assembleStandardDebug :demo:assembleStandardDebugAndroidTest --stacktrace

    - name: Run demo smoke test
      if: steps.key.outputs.available == 'true'
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
      with:
        # Emulators never update Google Play services, so the image's bundled version decides the
        # maps renderer. API 34 images bundle 23.18, which only loads the legacy renderer, and
        # adding advanced markers there crashes inside Play services.
        api-level: 36
        target: google_apis
        arch: x86_64
        disable-animations: true
        script: >-
          ./gradlew :demo:connectedStandardDebugAndroidTest --stacktrace
          -Pandroid.testInstrumentationRunnerArguments.package=com.google.maps.android.utils.demo.smoke
          -Pandroid.testInstrumentationRunnerArguments.requireMapLoaded=true

    - name: Upload test reports
      if: always() && steps.key.outputs.available == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: demo-smoke-test-reports
        path: |
          demo/build/reports/androidTests
          demo/build/outputs/androidTest-results
